<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>felixyates.com</title>
    
    <!-- Decap CMS Netlify Identity Widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <!-- Lightweight FrontMatter Parser -->
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <!-- Lightweight Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: "Courier New", Courier, monospace;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.5;
        }

        header {
            border-bottom: 2px solid #fff;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .admin-link {
            font-size: 0.8rem;
            color: #888;
            text-decoration: none;
            border: 1px solid #444;
            padding: 4px 8px;
        }

        .admin-link:hover {
            color: #000;
            background: #fff;
            border-color: #fff;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        @media (min-width: 600px) {
            .controls {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        input[type="text"], select {
            background: #000;
            color: #fff;
            border: 1px solid #fff;
            font-family: "Courier New", Courier, monospace;
            padding: 8px;
            font-size: 0.9rem;
            outline: none;
        }

        input[type="text"]:focus, select:focus {
            background: #111;
        }

        .search-box {
            width: 100%;
            max-width: 400px;
        }

        .sort-box {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
        }

        .post-count {
            font-size: 0.85rem;
            margin-bottom: 20px;
            color: #888;
        }

        #posts-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .post {
            border: 1px solid #fff;
            padding: 20px;
        }

        .post-header {
            border-bottom: 1px dashed #fff;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .post-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .post-date {
            font-size: 0.75rem;
            color: #aaa;
        }

        .post-body {
            font-size: 0.95rem;
            word-wrap: break-word;
        }

        .post-body p {
            margin-bottom: 10px;
        }

        .post-body p:last-child {
            margin-bottom: 0;
        }

        .post-body a {
            color: #fff;
        }

        .post-image {
            margin-top: 15px;
            max-width: 100%;
            border: 1px solid #fff;
            display: block;
        }

        .status-msg {
            border: 1px dashed #444;
            padding: 30px;
            text-align: center;
            color: #888;
        }

        footer {
            margin-top: 50px;
            border-top: 1px solid #333;
            padding-top: 20px;
            font-size: 0.75rem;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <h1>felixyates.com</h1>
            <a href="/admin/" class="admin-link">[admin]</a>
        </div>
        <div class="controls">
            <input type="text" id="search-input" class="search-box" placeholder="Search posts..." oninput="renderPosts()">
            <div class="sort-box">
                <label for="sort-order">Sort:</label>
                <select id="sort-order" onchange="renderPosts()">
                    <option value="newest">Most Recent First</option>
                    <option value="oldest">Oldest First</option>
                </select>
            </div>
        </div>
    </header>

    <main>
        <div id="post-count" class="post-count">Loading posts...</div>
        <div id="posts-container">
            <div class="status-msg">Fetching markdown posts...</div>
        </div>
    </main>

    <footer>
        <p>&copy; felixyates.com</p>
    </footer>

    <script>
        const REPO_OWNER = 'FelixYates4';
        const REPO_NAME = 'felixyates.com';
        const POSTS_FOLDER = 'content/posts'; // Updated to match your config.yml folder path

        let allPosts = [];

        // Handle Netlify Identity Login Redirection
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) {
                    window.netlifyIdentity.on("login", () => {
                        document.location.href = "/admin/";
                    });
                }
            });
        }

        // Fetch and parse Markdown files from GitHub repository
        async function fetchPosts() {
            const container = document.getElementById('posts-container');
            const countEl = document.getElementById('post-count');
            
            try {
                const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${POSTS_FOLDER}`;
                const response = await fetch(apiUrl);

                if (!response.ok) {
                    if (response.status === 404) {
                        countEl.textContent = '0 posts found';
                        container.innerHTML = '<div class="status-msg">No posts directory found in repository yet. Create your first post in /admin.</div>';
                        return;
                    }
                    throw new Error(`GitHub API returned status ${response.status}`);
                }

                const files = await response.json();
                const mdFiles = files.filter(file => file.name.endsWith('.md'));

                if (mdFiles.length === 0) {
                    countEl.textContent = '0 posts found';
                    container.innerHTML = '<div class="status-msg">No markdown posts found.</div>';
                    return;
                }

                // Download and parse each Markdown post file
                const fetchPromises = mdFiles.map(async file => {
                    const rawRes = await fetch(file.download_url);
                    const text = await rawRes.text();
                    return parseFrontMatter(text);
                });

                allPosts = await Promise.all(fetchPromises);
                renderPosts();

            } catch (err) {
                console.error('Error loading posts:', err);
                countEl.textContent = '';
                container.innerHTML = `<div class="status-msg">Error loading posts: ${escapeHtml(err.message)}</div>`;
            }
        }

        // Parse YAML Front Matter (between --- tags) and Markdown body
        function parseFrontMatter(text) {
            const match = text.match(/^---?\n([\s\S]*?)?\n---?\n([\s\S]*)$/);
            if (!match) {
                return {
                    title: 'Untitled',
                    date: '',
                    image: '',
                    rawContent: text,
                    htmlContent: marked.parse(text)
                };
            }

            const yamlHeader = match[1];
            const body = match[2];
            const meta = jsyaml.load(yamlHeader) || {};

            let formattedDate = meta.date || '';
            if (formattedDate instanceof Date) {
                formattedDate = formattedDate.toISOString().replace('T', ' ').substring(0, 16);
            } else if (typeof formattedDate === 'string') {
                formattedDate = formattedDate.replace('T', ' ').substring(0, 16);
            }

            return {
                title: meta.title || 'Untitled',
                date: formattedDate,
                image: meta.image || '',
                rawContent: body,
                htmlContent: marked.parse(body)
            };
        }

        function renderPosts() {
            const container = document.getElementById('posts-container');
            const countEl = document.getElementById('post-count');
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const sortOrder = document.getElementById('sort-order').value;

            let filtered = allPosts.filter(post => {
                const matchesTitle = post.title.toLowerCase().includes(query);
                const matchesContent = post.rawContent.toLowerCase().includes(query);
                return matchesTitle || matchesContent;
            });

            filtered.sort((a, b) => {
                const dateA = new Date(a.date || 0);
                const dateB = new Date(b.date || 0);
                return sortOrder === 'newest' ? dateB - dateA : dateA - dateB;
            });

            countEl.textContent = `Showing ${filtered.length} of ${allPosts.length} post(s)`;
            container.innerHTML = '';

            if (filtered.length === 0) {
                container.innerHTML = '<div class="status-msg">No matching posts found.</div>';
                return;
            }

            filtered.forEach(post => {
                const article = document.createElement('article');
                article.className = 'post';

                let imageHtml = '';
                if (post.image && post.image.trim() !== '') {
                    imageHtml = `<img src="${escapeHtml(post.image)}" class="post-image" alt="Post media attachment">`;
                }

                article.innerHTML = `
                    <div class="post-header">
                        <div class="post-title">${escapeHtml(post.title)}</div>
                        <div class="post-date">[${escapeHtml(post.date)}]</div>
                    </div>
                    <div class="post-body">${post.htmlContent}</div>
                    ${imageHtml}
                `;

                container.appendChild(article);
            });
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        fetchPosts();
    </script>
</body>
</html>
